name: Process AI Queue

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — covers mention responses + debate flow
  workflow_dispatch:          # manual trigger — GitHub UI or API dispatch from Vercel after()
    inputs:
      skip_checks:
        description: 'Skip agent connectivity check (set true for API-triggered runs)'
        required: false
        default: 'false'
      force_rollup_week:
        description: 'Queue weekly rollup for the latest 7-day period (backfill)'
        required: false
        default: 'false'
      force_rollup_month:
        description: 'Queue monthly rollup for the previous calendar month (backfill)'
        required: false
        default: 'false'

permissions:
  models: read    # allows github.token to call GitHub Models API — no PAT needed

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # safety ceiling — queue should drain in < 5 min normally

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check agent connectivity
        id: check_agents
        if: ${{ github.event.inputs.skip_checks != 'true' }}
        run: npx tsx scripts/check-agents.ts
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # github.token is auto-generated per run — never expires, no manual renewal needed.
          # GH_MODELS_TOKEN secret is kept as fallback if github.token loses models access.
          GH_MODELS_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Report agent health
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check_agents.outcome }}
          APP_URL:       ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET:   ${{ secrets.CRON_SECRET }}
        run: |
          echo "## Agent Health Check" >> $GITHUB_STEP_SUMMARY
          echo "- Outcome: **${CHECK_OUTCOME}**" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          if [ "${CHECK_OUTCOME}" = "failure" ]; then
            echo "- :warning: One or more agents failed connectivity. Queue processing continues with available agents." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${APP_URL}" ] && [ -n "${CRON_SECRET}" ]; then
            curl -sf -X POST "${APP_URL}/api/internal/agent-health-report" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -d "{\"checkOutcome\":\"${CHECK_OUTCOME}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true
          fi

      - name: Process AI queue
        run: npx tsx scripts/process-queue.ts
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN:    ${{ github.token }}
          AI_LAB_ROOM_ID:     ${{ secrets.AI_LAB_ROOM_ID }}
          AI_LAB_ENABLED:     "true"
          CURRENTS_API_KEY:   ${{ secrets.CURRENTS_API_KEY }}
          NEWSDATA_API_KEY:   ${{ secrets.NEWSDATA_API_KEY }}
          FORCE_ROLLUP_WEEK:  ${{ github.event.inputs.force_rollup_week }}
          FORCE_ROLLUP_MONTH: ${{ github.event.inputs.force_rollup_month }}
          # Optional model overrides — only needed if you've set these in Vercel too
          # AGENT_MODEL_ADMIN:     ${{ secrets.AGENT_MODEL_ADMIN }}
          # AGENT_MODEL_LLAMA:     ${{ secrets.AGENT_MODEL_LLAMA }}
          # AGENT_MODEL_GPTOSS:    ${{ secrets.AGENT_MODEL_GPTOSS }}
          # AGENT_MODEL_QWEN:      ${{ secrets.AGENT_MODEL_QWEN }}
          # AGENT_MODEL_ARCHIVIST: ${{ secrets.AGENT_MODEL_ARCHIVIST }}

      - name: Fail if agent health check failed
        if: ${{ steps.check_agents.outcome == 'failure' }}
        run: |
          echo "::error::Agent health check failed; queue processing completed with degraded providers"
          exit 1
